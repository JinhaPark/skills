name: DCF regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run DCF regression tests from repository root
        run: python -m unittest discover -s discover-value-stocks/subskills/data/distress-adjusted-dcf/tests -v
      - name: Run research workflow and dashboard tests
        run: python -m unittest discover -s discover-value-stocks/tests -v
      - name: Check README dashboard matches the public record
        run: python discover-value-stocks/scripts/render_dashboard.py discover-value-stocks/subskills/data/cashflow-dashboard.json discover-value-stocks/subskills/data/README.md --check
